<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div id="pulse-bg" class="pulse-bg" aria-hidden="true"></div>
  <div id="mrr-ticker" class="mrr-ticker mono">MRR $48,210</div>

  <div class="card">
    <div class="card-head">
      <div class="eyebrow">Ledger</div>
      <h1>Sign in to your books</h1>
      <p class="sub">Subscriptions, invoices, and retries — all in one place.</p>
    </div>

    <form id="login-form">
      <label>
        <span>Email</span>
        <input id="email" type="email" placeholder="you@company.com" required />
      </label>

      <label>
        <span>Password</span>
        <div class="pw-wrap">
          <input id="password" type="password" placeholder="••••••••" required />
          <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Show password">Show</button>
        </div>
      </label>

      <div class="forgot-row">
        <button type="button" class="link-btn">Forgot password?</button>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">Sign in →</button>
    </form>

    <div class="card-foot">
      New here? <button class="link-btn strong">Create an account</button>
    </div>

    <a href="index.html" class="back-link">← Back to home</a>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
